<!DOCTYPE html>
<html>
    <head>
        <title>Rock Paper Scissors</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <p id="game-title">Rock Paper Scissors</p>

        <p id="player-choice">Player choice: </p>
        <p id="computer-choice">Computer choice: </p>

        <div id="container">
            <div id="win-count">
                <p id="player-wins">Player: 0</p>
                <p id="computer-wins">Computer: 0</p>
            </div>

            <h1 id="win-text"></h1>
            <div id="win-underline"></div>
        
            <div class="button-container">
                <button id="rock-choice" class="player-button">Rock</button>
                <button id="paper-choice" class="player-button">Paper</button>
                <button id="scissors-choice" class="player-button">Scissors</button>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
